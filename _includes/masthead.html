{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button class="masthead__nav-toggle" hidden aria-hidden="true"><span class="navicon"></span></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign nav_url = link.url %}
            {% else %}
              {% assign nav_url = link.url | relative_url %}
            {% endif %}
            <li class="masthead__menu-item persist"><a href="{{ nav_url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__palette persist tail">
            <label class="screen-reader-text" for="palette-select">Color theme</label>
            <span class="masthead__palette-label" aria-hidden="true">Colors</span>
            <select id="palette-select" aria-label="Color theme">
              <option value="default">Default</option>
              <option value="sage">Sage</option>
              <option value="ocean">Ocean</option>
              <option value="slate">Slate</option>
              <option value="sand">Sand</option>
              <option value="rose">Rose</option>
              <option value="coral">Coral</option>
              <option value="tangerine">Tangerine</option>
              <option value="amber">Amber</option>
              <option value="honey">Honey</option>
              <option value="olive">Olive</option>
              <option value="moss">Moss</option>
              <option value="pine">Pine</option>
              <option value="teal">Teal</option>
              <option value="aqua">Aqua</option>
              <option value="sky">Sky</option>
              <option value="cobalt">Cobalt</option>
              <option value="indigo">Indigo</option>
              <option value="violet">Violet</option>
              <option value="plum">Plum</option>
              <option value="magenta">Magenta</option>
              <option value="ruby">Ruby</option>
              <option value="graphite">Graphite</option>
              <option value="zinc">Zinc</option>
              <option value="pearl">Pearl</option>
              <option value="lagoon">Lagoon</option>
              <option value="denim">Denim</option>
              <option value="orchid">Orchid</option>
              <option value="copper">Copper</option>
              <option value="espresso">Espresso</option>
            </select>
          </li>
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
