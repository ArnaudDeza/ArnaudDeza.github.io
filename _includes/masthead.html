{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button type="button" class="masthead__nav-toggle hidden" aria-label="Open navigation" aria-expanded="false"><span class="navicon"></span></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign nav_url = link.url %}
            {% else %}
              {% assign nav_url = link.url | relative_url %}
            {% endif %}
            <li class="masthead__menu-item persist"><a href="{{ nav_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <button type="button" aria-label="Switch to dark mode" aria-pressed="false"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></button>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
